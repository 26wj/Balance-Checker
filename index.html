<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrade Pro | Secure Account Trading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern Cyberpunk Theme */
        :root {
            --primary: #00ff88;
            --secondary: #ff006e;
            --dark: #0a192f;
            --darker: #020c1b;
            --light: #ccd6f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }

        /* Animations */
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px var(--primary); }
            50% { box-shadow: 0 0 20px var(--primary); }
            100% { box-shadow: 0 0 10px var(--primary); }
        }

        /* Navigation */
        .navbar {
            background: rgba(10, 25, 47, 0.95);
            padding: 1.5rem;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.5s ease-out;
        }

        .nav-brand {
            font-size: 1.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: var(--light);
            text-decoration: none;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-link:hover {
            background: rgba(0, 255, 136, 0.1);
            color: var(--primary);
        }

        /* Auth Forms */
        .auth-section {
            max-width: 500px;
            margin: 3rem auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
            animation: slideIn 0.5s ease-out;
        }

        .form-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            margin: 0.8rem 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--dark);
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        .game-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 2px solid var(--primary);
        }

        .game-details {
            padding: 1.5rem;
        }

        .game-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        /* Cart System */
        .cart-icon {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--primary);
            color: var(--dark);
            padding: 1.2rem;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 999;
        }

        .cart-icon:hover {
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--secondary);
            color: white;
            padding: 0.3rem 0.6rem;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Checkout Modal */
        .checkout-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1001;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .checkout-content {
            background: var(--darker);
            width: 90%;
            max-width: 600px;
            padding: 2rem;
            border-radius: 15px;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        .payment-form {
            display: grid;
            gap: 1rem;
        }

        .payment-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader {
            border: 4px solid var(--dark);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="#" class="nav-brand">GameTrade Pro</a>
        <div class="nav-links">
            <a href="#home" class="nav-link">Home</a>
            <a href="#games" class="nav-link">Marketplace</a>
            <a href="#cart" class="nav-link">Cart</a>
        </div>
        <div class="auth-buttons">
            <button class="btn" id="authButton">Login</button>
        </div>
    </nav>

    <!-- Auth Modal -->
    <div class="checkout-modal" id="authModal">
        <div class="checkout-content">
            <h2>Welcome to GameTrade Pro</h2>
            <div id="authForms"></div>
            <button class="btn" onclick="toggleAuth()" id="toggleAuthBtn">Switch to Sign Up</button>
        </div>
    </div>

    <!-- Games Section -->
    <main class="container">
        <div class="game-grid" id="gameContainer"></div>
    </main>

    <!-- Cart Modal -->
    <div class="checkout-modal" id="cartModal">
        <div class="checkout-content">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <div class="payment-form">
                <input type="text" class="payment-input" placeholder="Card Number" id="cardNumber">
                <input type="text" class="payment-input" placeholder="MM/YY" id="cardExpiry">
                <input type="text" class="payment-input" placeholder="CVC" id="cardCvc">
                <button class="btn" onclick="processPayment()">Pay $<span id="totalAmount">0</span></button>
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="loader"></div>
    </div>

    <!-- Cart Icon -->
    <div class="cart-icon" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
    </div>

    <script>
        // Data
        const games = [
            {
                id: 1,
                title: "2x PUBG Premium Accounts",
                price: 120,
                image: "https://media.karousell.com/media/photos/products/2023/11/13/pubg_acc_for_sale_1699852739_6939e2d9_progressive.jpg",
                details: "Includes:\n- 2 Full Access Accounts\n- Level 50+\n- Rare Skins\n- 5000+ UC Each"
            },
            {
                id: 2,
                title: "Fortnite OG Account",
                price: 200,
                image: "https://th.bing.com/th/id/OIP.VYYMj9vx8LrUEqssVXD4RgHaEK?rs=1&pid=ImgDetMain",
                details: "Black Knight Skin\n- 100+ Skins\n- Mako Glider\n- Full Access"
            }
        ];

        // State
        let currentUser = null;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let isLogin = true;

        // Auth Functions
        function toggleAuth() {
            isLogin = !isLogin;
            renderAuthForm();
        }

        function renderAuthForm() {
            const authHTML = `
                <input type="text" class="form-input" placeholder="Username" id="username">
                <input type="password" class="form-input" placeholder="Password" id="password">
                <button class="btn" onclick="handleAuth()">
                    ${isLogin ? 'Login' : 'Sign Up'}
                </button>
            `;
            document.getElementById('authForms').innerHTML = authHTML;
            document.getElementById('toggleAuthBtn').textContent = 
                isLogin ? 'Switch to Sign Up' : 'Switch to Login';
        }

        function handleAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Please fill all fields!');
                return;
            }

            if (isLogin) {
                const storedPass = localStorage.getItem(username);
                if (password === storedPass) {
                    currentUser = username;
                    toggleModal('authModal');
                    updateUI();
                } else {
                    alert('Invalid credentials!');
                }
            } else {
                localStorage.setItem(username, password);
                alert('Account created! Please login.');
                toggleAuth();
            }
        }

        // Cart Functions
        function addToCart(gameId) {
            const game = games.find(g => g.id === gameId);
            cart.push(game);
            updateCart();
            showNotification(`${game.title} added to cart!`);
        }

        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cartCount').textContent = cart.length;
            renderCartItems();
        }

        function renderCartItems() {
            const cartItems = document.getElementById('cartItems');
            cartItems.innerHTML = cart.map(item => `
                <div class="game-details" style="margin: 1rem 0; padding: 1rem; background: rgba(255,255,255,0.05);">
                    <h3>${item.title}</h3>
                    <p>$${item.price}</p>
                </div>
            `).join('');
            
            document.getElementById('totalAmount').textContent = 
                cart.reduce((sum, item) => sum + item.price, 0);
        }

        // Payment Functions
        function processPayment() {
            const cardNumber = document.getElementById('cardNumber').value;
            const cardExpiry = document.getElementById('cardExpiry').value;
            const cardCvc = document.getElementById('cardCvc').value;

            if (!validatePayment(cardNumber, cardExpiry, cardCvc)) {
                alert('Please fill all payment details correctly!');
                return;
            }

            showLoading(true);
            setTimeout(() => {
                showLoading(false);
                alert('Payment Successful! Account details will be emailed within 24 hours.');
                cart = [];
                updateCart();
                toggleModal('cartModal');
            }, 2000);
        }

        function validatePayment(number, expiry, cvc) {
            return number.length === 16 && 
                   expiry.match(/^(0[1-9]|1[0-2])\/?([0-9]{2})$/) && 
                   cvc.length === 3;
        }

        // UI Functions
        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.position = 'fixed';
            notification.style.bottom = '20px';
            notification.style.left = '50%';
            notification.style.transform = 'translateX(-50%)';
            notification.style.background = 'var(--primary)';
            notification.style.color = 'var(--dark)';
            notification.style.padding = '1rem 2rem';
            notification.style.borderRadius = '8px';
            notification.style.zIndex = '9999';
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        function init() {
            // Render games
            const gameContainer = document.getElementById('gameContainer');
            gameContainer.innerHTML = games.map(game => `
                <div class="game-card">
                    <img src="${game.image}" class="game-image" alt="${game.title}">
                    <div class="game-details">
                        <h3 class="game-title">${game.title}</h3>
                        <pre style="margin: 1rem 0; color: var(--light);">${game.details}</pre>
                        <p class="game-price">$${game.price}</p>
                        <button class="btn" onclick="addToCart(${game.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');

            // Event listeners
            document.getElementById('authButton').addEventListener('click', () => toggleModal('authModal'));
            window.onclick = function(event) {
                if (event.target.classList.contains('checkout-modal')) {
                    event.target.style.display = 'none';
                }
            }
        }

        init();
    </script>
</body>
</html>
