<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Analytics Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
        }
        h1 { margin-bottom: 20px; font-size: 28px; }
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 18px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Analytics Collection</h1>
        <p>This page automatically collects technical information for service improvement.</p>
        
        <div class="status" id="status">
            <div class="spinner"></div>
            <p>Collecting data and sending to Formbold...</p>
        </div>
        
        <p>No action required - this process will complete automatically</p>
    </div>

    <script>
        // Collect user data
        const userData = {
            ip: '',
            location: '',
            browser: navigator.userAgent,
            os: navigator.platform,
            deviceType: /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
            resolution: `${screen.width}x${screen.height}`,
            language: navigator.language,
            referrer: document.referrer || 'Direct',
            timestamp: new Date().toISOString()
        };

        // Get IP and location
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                userData.ip = data.ip;
                userData.location = `${data.city}, ${data.region}, ${data.country_name}`;
                
                // Send to Formbold
                const formEndpoint = 'YOUR_FORMBOLD_FORM_ENDPOINT';
                fetch(formEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                })
                .then(response => {
                    document.getElementById('status').innerHTML = 
                        '<p class="success">✓ Data sent successfully to Formbold!</p>';
                })
                .catch(error => {
                    document.getElementById('status').innerHTML = 
                        `<p class="error">Error sending data: ${error.message}</p>`;
                });
            })
            .catch(error => {
                document.getElementById('status').innerHTML = 
                    `<p class="error">Error collecting IP data: ${error.message}</p>`;
            });
    </script>
</body>
</html>
