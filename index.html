<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            color: #f4f4f4;
            overflow: hidden;
        }

        /* Title Bar */
        .title-bar {
            background-color: #2c2f3f;
            color: #fff;
            padding: 20px 40px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #ff6f61;
        }

        /* Chatbox and Messages */
        .chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            height: 100%;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: scroll;
            background-color: #1a1a2e;
            border-bottom: 2px solid #444;
            color: #e5e5e5;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-end;
            font-size: 16px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 1s ease-in-out;
        }

        /* User and AI Message Styles */
        .user-message {
            background-color: #4caf50;
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 70%;
            align-self: flex-end;
            animation: slideIn 0.5s ease-out;
            word-wrap: break-word;
        }

        .ai-message {
            background-color: #3e3f5e;
            color: #f4f4f4;
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 70%;
            align-self: flex-start;
            animation: fadeIn 0.5s ease-out;
            word-wrap: break-word;
        }

        .coding-message {
            background-color: #222;
            color: #87cefa;
            padding: 12px 20px;
            border-radius: 20px;
            max-width: 70%;
            font-family: 'Courier New', Courier, monospace;
            word-wrap: break-word;
            align-self: flex-start;
            animation: fadeIn 0.5s ease-out;
        }

        .typing-indicator {
            font-size: 14px;
            color: #888;
            font-style: italic;
            animation: fadeIn 1s ease-in-out;
        }

        /* Input Box and Button */
        .input-container {
            display: flex;
            padding: 20px;
            background-color: #111;
            border-top: 2px solid #444;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        input {
            width: 80%;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 20px;
            background-color: #111;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        input:focus {
            border-color: #28a745;
            background-color: #222;
        }

        button {
            padding: 15px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #218838;
            transform: scale(1.1);
        }

        /* Scrollbar Customization */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #444;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #28a745;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .input-container {
                flex-direction: column;
                align-items: stretch;
            }

            input {
                width: 100%;
                margin-bottom: 10px;
            }

            button {
                width: 100%;
                padding: 15px;
            }
        }

    </style>
</head>
<body>

    <div class="title-bar">
        <button class="back-btn" onclick="goBack()">←</button>
        Chat with GPT-4o
    </div>

    <div class="chat-container">
        <div class="chat-box" id="chat-box"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type a message..." onkeydown="handleKeyDown(event)" />
            <button onclick="sendMessage()">+</button>
        </div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        // Handle sending message on Enter key press
        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Go back to the previous screen (or reset the chat)
        function goBack() {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
        }

        // Function to handle sending and receiving messages
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userMessage = inputField.value.trim();

            if (!userMessage) return;

            // Display user message
            chatBox.innerHTML += `<div class="user-message"><strong>You:</strong> ${userMessage}</div>`;
            inputField.value = "";

            // Scroll to bottom of the chat box
            chatBox.scrollTop = chatBox.scrollHeight;

            // Show typing indicator while AI is "thinking"
            const loadingIndicator = document.createElement('div');
            loadingIndicator.classList.add('typing-indicator');
            loadingIndicator.textContent = 'AI is typing...';
            chatBox.appendChild(loadingIndicator);

            try {
                // Send message to GPT-4o
                const response = await puter.ai.chat(userMessage);
                console.log(response); // Debugging the AI response

                // Remove typing indicator
                loadingIndicator.remove();

                // Display AI response
                let botMessage = response;
                if (botMessage.includes("```")) {
                    chatBox.innerHTML += `<div class="coding-message"><strong>AI:</strong> ${botMessage}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="ai-message"><strong>AI:</strong> ${botMessage}</div>`;
                }

                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                // Handle potential error
                console.error("Error:", error);
                loadingIndicator.remove();
                chatBox.innerHTML += `<div class="ai-message"><strong>AI:</strong> Sorry, something went wrong.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>

</body>
</html>
